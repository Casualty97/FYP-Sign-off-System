# Weekly housekeeping. Opens or updates an issue when something needs a human; never pushes code.
name: Maintenance

on:
  schedule:
    - cron: '17 1 * * 1' # Mondays 09:17 Singapore time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-and-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit (high and critical)
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Check that every pinned CDN file still exists
        id: cdn
        continue-on-error: true
        run: |
          node -e "
            const fs=require('fs');const path=require('path');
            const walk=(d,o=[])=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){if(e.isDirectory()){if(!['node_modules','.git','legacy'].includes(e.name))walk(path.join(d,e.name),o);}else if(/\.(js|html)$/.test(e.name))o.push(path.join(d,e.name));}return o;};
            const urls=new Set();
            for(const f of walk('frontend'))for(const m of fs.readFileSync(f,'utf8').matchAll(/https?:\/\/(cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com|unpkg\.com|ajax\.googleapis\.com|storage\.googleapis\.com)[^'\"\`\s)<>]*/g))urls.add(m[0]);
            (async()=>{let bad=0;for(const u of urls){try{const r=await fetch(u,{method:'HEAD'});if(!r.ok){bad++;console.log('::error::'+r.status+' '+u);}else console.log('ok '+u);}catch(e){bad++;console.log('::error::'+e.message+' '+u);}}process.exit(bad?1:0);})();"
      - name: Open or update the maintenance issue
        if: steps.audit.outcome == 'failure' || steps.cdn.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Maintenance: dependency audit or CDN links need attention';
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n- npm audit: ${{ steps.audit.outcome }}\n- CDN link check: ${{ steps.cdn.outcome }}\n\nOpen the run for details. Close this issue once fixed.`;
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'maintenance' });
            const existing = issues.find((i) => i.title === title);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['maintenance'] });
