# Builds the offline install package of the kiosk from main after CI passed and publishes it as a GitHub Release.
# The PC at the centre installs from the release asset (by hand, or with the one command install). Nothing is
# deployed automatically.
name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    # <Jun Kai/> only a green CI of a push to this repo's main: "branches: [main]" also matches a pull request from a
    # fork whose branch is called main, and this job may publish
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    # <Jun Kai start>
    # Windows, because the package carries packages built for Windows x64 (bcrypt, sharp) and the Visual C++ runtime.
    # A normal release (not a pre-release) with fixed asset names, so .../releases/latest/download/<name> always
    # gives the newest one; that is the address get-kiosk.ps1 uses.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # the build number is the number of commits
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # no cache for the Node.js and MySQL downloads here: a job that may publish must not read files a pull request
      # could have cached (the npm cache of setup-node is kept per branch, so main's own)
      - name: Build the package, with and without the offline AI model
        run: node scripts/install/build-package.js --out C:\rpkb --with-ai-model
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$(git rev-list --count HEAD)
          SHA7=$(git rev-parse --short=7 HEAD)
          TAG="build-$BUILD-$SHA7"
          D=/c/rpkb/dist
          cat > notes.md <<EOF
          Kiosk build $BUILD, from commit $(git rev-parse HEAD), built $(date -u +'%Y-%m-%d %H:%M UTC').

          **Install on a Windows 10 or 11 PC with nothing installed** (Node.js and MySQL are inside the package):
          - Download rp-xperience-kiosk-windows-x64.zip, unzip it, run install.cmd (README.txt inside lists the options).
          - Or paste this one line into PowerShell; it downloads the same zip and runs the same install.cmd:

          \`\`\`
          curl.exe -fsSLo "\$env:TEMP\get-kiosk.ps1" https://github.com/${{ github.repository }}/releases/latest/download/get-kiosk.ps1; powershell -NoProfile -ExecutionPolicy Bypass -File "\$env:TEMP\get-kiosk.ps1"
          \`\`\`

          Running install.cmd of a newer build updates an installed PC and keeps all data. Uninstall: C:\\RPXperienceKiosk\\app\\uninstall.cmd.
          The -ai zip also holds the sentiment model, so that AI feature works without internet.
          Check a download: each zip has a .sha256 file next to it.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" \
            "$D/rp-xperience-kiosk-windows-x64.zip" "$D/rp-xperience-kiosk-windows-x64.zip.sha256" \
            "$D/rp-xperience-kiosk-windows-x64-ai.zip" "$D/rp-xperience-kiosk-windows-x64-ai.zip.sha256" \
            "$D/get-kiosk.ps1" \
            --title "Kiosk build $BUILD" --notes-file notes.md --target "$(git rev-parse HEAD)" --latest
    # <Jun Kai end>
